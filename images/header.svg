<svg width="1000" height="390" viewBox="0 0 1000 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueBg" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5368E8"/>
      <stop offset="55%" stop-color="#4658DC"/>
      <stop offset="100%" stop-color="#3849C8"/>
    </linearGradient>

    <linearGradient id="pyCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E294D"/>
      <stop offset="100%" stop-color="#0D1832"/>
    </linearGradient>

    <linearGradient id="javaCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14271A"/>
      <stop offset="100%" stop-color="#0B140E"/>
    </linearGradient>

    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.32"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <mask id="pyTypingMask">
      <rect x="36" y="270" width="0" height="24" fill="white">
        <animate attributeName="width"
          dur="10s" repeatCount="indefinite"
          values="0;0;320;320;0;0"
          keyTimes="0;0.10;0.40;0.56;0.60;1"/>
      </rect>
    </mask>

    <mask id="javaTypingMask">
      <rect x="514" y="270" width="0" height="24" fill="white">
        <animate attributeName="width"
          dur="10s" repeatCount="indefinite"
          values="0;0;360;360;0;0"
          keyTimes="0;0.10;0.40;0.56;0.60;1"/>
      </rect>
    </mask>

    <mask id="pyOutputMask">
      <rect x="34" y="334" width="0" height="22" fill="white">
        <animate attributeName="width"
          dur="10s" repeatCount="indefinite"
          values="0;0;0;220;220;0;0"
          keyTimes="0;0.34;0.40;0.50;0.56;0.62;1"/>
      </rect>
    </mask>

    <mask id="javaOutputMask">
      <rect x="512" y="334" width="0" height="22" fill="white">
        <animate attributeName="width"
          dur="10s" repeatCount="indefinite"
          values="0;0;0;220;220;0;0"
          keyTimes="0;0.34;0.40;0.50;0.56;0.62;1"/>
      </rect>
    </mask>
  </defs>

  <rect width="1000" height="390" fill="#F6F6F6"/>

  <path fill="url(#blueBg)">
    <animate attributeName="d"
      dur="4.6s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines=".42 0 .58 1; .42 0 .58 1; .42 0 .58 1"
      values="
        M0 20 H1000 V145 C925 154 850 184 780 208 C700 234 615 180 525 182 C430 184 355 188 270 171 C200 157 125 168 65 174 C35 177 12 176 0 169 Z;
        M0 20 H1000 V145 C930 181 842 224 752 207 C668 190 620 164 525 172 C438 179 350 202 258 182 C172 163 122 154 62 173 C32 181 10 179 0 167 Z;
        M0 20 H1000 V145 C900 176 836 146 750 182 C666 219 600 228 515 194 C436 163 348 168 262 173 C180 178 122 193 64 178 C34 171 12 166 0 160 Z;
        M0 20 H1000 V145 C925 154 850 184 780 208 C700 234 615 180 525 182 C430 184 355 188 270 171 C200 157 125 168 65 174 C35 177 12 176 0 169 Z
      "/>
  </path>

  <path fill="#6F80FF" fill-opacity="0.24">
    <animate attributeName="d"
      dur="3.8s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines=".42 0 .58 1; .42 0 .58 1; .42 0 .58 1"
      values="
        M0 141 C95 160 185 132 286 145 C378 157 455 172 562 158 C668 144 735 184 824 164 C900 146 950 131 1000 122 V20 H0 Z;
        M0 146 C92 175 198 150 287 139 C384 127 464 145 558 165 C654 184 734 146 825 154 C902 161 955 140 1000 126 V20 H0 Z;
        M0 132 C92 143 188 171 286 162 C388 152 458 132 556 144 C664 157 735 188 825 171 C907 156 956 130 1000 118 V20 H0 Z;
        M0 141 C95 160 185 132 286 145 C378 157 455 172 562 158 C668 144 735 184 824 164 C900 146 950 131 1000 122 V20 H0 Z
      "/>
  </path>

  <!-- Bolhas mais suaves -->
  <g fill="#A8B6FF" fill-opacity="0.34" stroke="#EEF1FF" stroke-opacity="0.82" stroke-width="1.2">
    <circle cx="110" cy="160" r="15" opacity="0">
      <animate attributeName="opacity" values="0;0.18;0.52;0.88;0.34;0" keyTimes="0;0.10;0.20;0.30;0.74;1" dur="5.0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="170;166;160;152;126;94;80" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="5.0s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="110;112;110;116;126;118;110" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="5.0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="13;14;15;15.5;16;15.2;14.4" dur="5.0s" repeatCount="indefinite"/>
    </circle>

    <circle cx="215" cy="54" r="16" opacity="0">
      <animate attributeName="opacity" values="0;0.16;0.46;0.84;0.30;0" keyTimes="0;0.10;0.20;0.30;0.74;1" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="66;62;54;48;24;2;-10" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="215;212;215;224;234;225;215" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;15;16;16.4;17;16.2;15" dur="5.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="330" cy="60" r="14" opacity="0">
      <animate attributeName="opacity" values="0;0.14;0.38;0.76;0.26;0" keyTimes="0;0.10;0.20;0.30;0.74;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="72;68;60;54;34;12;0" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="330;326;330;338;348;338;330" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="12.5;13.2;14;14.4;15;14.2;13.4" dur="4.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="690" cy="102" r="17" opacity="0">
      <animate attributeName="opacity" values="0;0.14;0.42;0.82;0.28;0" keyTimes="0;0.08;0.18;0.28;0.72;1" dur="6.0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="114;110;102;94;70;34;12" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="6.0s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="690;694;690;702;714;702;690" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="6.0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="15;16;17;17.5;18;17.2;16" dur="6.0s" repeatCount="indefinite"/>
    </circle>

    <circle cx="835" cy="172" r="16" opacity="0">
      <animate attributeName="opacity" values="0;0.16;0.44;0.86;0.30;0" keyTimes="0;0.08;0.18;0.28;0.72;1" dur="5.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="184;180;172;164;136;102;86" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="5.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="835;830;835;844;856;846;835" keyTimes="0;0.12;0.24;0.42;0.62;0.82;1" dur="5.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;15;16;16.4;17;16.2;15" dur="5.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="500" y="92"
    text-anchor="middle"
    font-family="'Arial Black', Impact, Arial, sans-serif"
    font-size="50"
    font-weight="900"
    letter-spacing="1.4"
    fill="#FFFFFF"
    filter="url(#titleShadow)">Pedro Henrique</text>

  <text x="500" y="132"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="0.9"
    fill="#D8DEFF">
    <animate attributeName="fill" values="#D8DEFF;#FFFFFF;#D4DBFF;#EEF1FF;#D8DEFF" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.82;0.92;1;0.9;0.82" dur="6.5s" repeatCount="indefinite"/>
    Back-End Developer • Software Architecture • Tech
  </text>

  <g>
    <animate attributeName="opacity"
      dur="10s"
      repeatCount="indefinite"
      values="0;1;1;0;0"
      keyTimes="0;0.08;0.56;0.66;1"/>

    <g filter="url(#cardShadow)">
      <rect x="24" y="226" width="452" height="123" rx="8" fill="url(#pyCard)"/>
      <rect x="24" y="226" width="452" height="27" rx="8" fill="#1C2548"/>
      <rect x="24" y="253" width="452" height="96" fill="url(#pyCard)"/>
      <rect x="24" y="303" width="452" height="46" fill="#07111E"/>

      <circle cx="43" cy="240" r="6" fill="#FF6B5C"/>
      <circle cx="62" cy="240" r="6" fill="#F6C145"/>
      <circle cx="81" cy="240" r="6" fill="#31C85A"/>

      <text x="250" y="244" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#99A6D3">main.py</text>

      <rect x="390" y="230" width="72" height="18" rx="4" fill="#3C83C4"/>
      <text x="426" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Python</text>

      <g mask="url(#pyTypingMask)">
        <text x="36" y="286" font-family="Consolas, 'Courier New', monospace" font-size="12.2" fill="#FFFFFF">
          <tspan fill="#F6F6F6">print</tspan><tspan fill="#D7D7D7">(</tspan><tspan fill="#F0A366">"Hello, Pedro Henrique! 👋"</tspan><tspan fill="#D7D7D7">)</tspan>
        </text>
      </g>

      <text y="286" font-family="Consolas, 'Courier New', monospace" font-size="12.2" fill="#FFFFFF">|
        <animate attributeName="x" dur="10s" repeatCount="indefinite"
          values="36;36;286;286;36"
          keyTimes="0;0.10;0.40;0.405;1"
          calcMode="linear"/>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
          values="0;1;1;0;0"
          keyTimes="0;0.10;0.40;0.405;1"/>
      </text>

      <text x="34" y="319" font-family="Consolas, monospace" font-size="10" fill="#69758E">OUTPUT</text>
      <g mask="url(#pyOutputMask)">
        <text x="34" y="342" font-family="Consolas, monospace" font-size="12.5" fill="#76D45A">Hello, Pedro Henrique! 👋</text>
      </g>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="502" y="226" width="452" height="123" rx="8" fill="url(#javaCard)"/>
      <rect x="502" y="226" width="452" height="27" rx="8" fill="#142117"/>
      <rect x="502" y="253" width="452" height="96" fill="url(#javaCard)"/>
      <rect x="502" y="303" width="452" height="46" fill="#070C08"/>

      <circle cx="521" cy="240" r="6" fill="#FF6B5C"/>
      <circle cx="540" cy="240" r="6" fill="#F6C145"/>
      <circle cx="559" cy="240" r="6" fill="#31C85A"/>

      <text x="728" y="244" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#7E9883">Main.java</text>

      <rect x="868" y="230" width="72" height="18" rx="4" fill="#C58619"/>
      <text x="904" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Java</text>

      <g mask="url(#javaTypingMask)">
        <text x="514" y="286" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#FFFFFF">
          <tspan fill="#F6F6F6">System.out.println</tspan><tspan fill="#D7D7D7">(</tspan><tspan fill="#F0A366">"Hello, Pedro Henrique! 👋"</tspan><tspan fill="#D7D7D7">);</tspan>
        </text>
      </g>

      <text y="286" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#FFFFFF">|
        <animate attributeName="x" dur="10s" repeatCount="indefinite"
          values="514;514;792;792;514"
          keyTimes="0;0.10;0.40;0.405;1"
          calcMode="linear"/>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
          values="0;1;1;0;0"
          keyTimes="0;0.10;0.40;0.405;1"/>
      </text>

      <text x="512" y="319" font-family="Consolas, monospace" font-size="10" fill="#637A66">OUTPUT</text>
      <g mask="url(#javaOutputMask)">
        <text x="512" y="342" font-family="Consolas, monospace" font-size="12.5" fill="#76D45A">Hello, Pedro Henrique! 👋</text>
      </g>
    </g>
  </g>
</svg>
