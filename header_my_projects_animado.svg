      letter-spacing="0.6">
      <animate attributeName="opacity" values="0.96;1;0.96" dur="4.6s" repeatCount="indefinite"/>
      My Projects
    </text>

    <!-- subtítulo -->
    <text x="640" y="156"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="33"
      font-weight="700"
      fill="#D8DEFF"
      filter="url(#subtitleGlow)">
      <animate attributeName="fill" values="#D8DEFF;#FFFFFF;#D4DBFF;#EEF1FF;#D8DEFF" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.82;0.92;1;0.9;0.82" dur="6.5s" repeatCount="indefinite"/>
      Python • Java • Integrações de APIs
