      </circle>
      <circle cx="163" cy="82" r="1.2">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="353" cy="145" r="1.8">
