<svg width="1280" height="230" viewBox="0 0 1280 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueBg" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5368E8"/>
      <stop offset="55%" stop-color="#4658DC"/>
      <stop offset="100%" stop-color="#3849C8"/>
    </linearGradient>

    <radialGradient id="bubbleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A8B6FF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#A8B6FF" stop-opacity="0.34"/>
    </radialGradient>

    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="subtitleGlow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#9CB4FF" flood-opacity="0.30"/>
    </filter>

    <clipPath id="clipRounded">
      <rect width="1280" height="230" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipRounded)">
    <!-- fundo transparente/branco abaixo -->
    <rect width="1280" height="230" fill="white" fill-opacity="0"/>

    <!-- área azul principal com borda inferior ondulada -->
    <path fill="url(#blueBg)">
      <animate attributeName="d"
        dur="4.8s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines=".42 0 .58 1; .42 0 .58 1; .42 0 .58 1"
        values="
          M0 0 H1280 V168 C1188 174 1092 205 996 223 C888 244 778 205 664 205 C545 205 447 208 338 194 C248 183 156 193 80 196 C40 198 14 198 0 194 Z;
          M0 0 H1280 V168 C1196 206 1080 243 954 224 C842 207 782 182 662 193 C548 203 438 225 320 205 C210 187 150 177 76 194 C38 202 12 201 0 196 Z;
          M0 0 H1280 V168 C1148 199 1074 168 952 201 C842 238 756 251 650 214 C548 179 438 183 328 190 C224 197 150 213 78 200 C40 194 14 188 0 182 Z;
          M0 0 H1280 V168 C1188 174 1092 205 996 223 C888 244 778 205 664 205 C545 205 447 208 338 194 C248 183 156 193 80 196 C40 198 14 198 0 194 Z
        "/>
    </path>

    <!-- brilhinhos -->
